<div class="controls">
  <button routerLink="/home/add" [replaceUrl]="true">+ Add</button>
  <button (click)="togglePremium()" [disabled]="housingService.selectedHousingCount === 0">
    Toggle Premium
  </button>
  <button (click)="shuffleCards()">Shuffle Cards</button>
  <button (click)="delectSelectedCards()" [disabled]="housingService.selectedHousingCount === 0">
    Delete Selected
  </button>
</div>

<section>
  <form>
    <input type="text" placeholder="Filter by city" #filter />
    <button class="primary" type="button" (click)="filterResults(filter.value)">Search</button>
  </form>
</section>
<section class="results">
  @for(housingLocation of housingLocationList(); track housingLocation.id) {
  <app-back-shadow
    ><app-housing-location [housingLocation]="housingLocation"></app-housing-location
  ></app-back-shadow>
  } @empty {
  <span>No Houses are available!</span>
  }
</section>
<router-outlet />
