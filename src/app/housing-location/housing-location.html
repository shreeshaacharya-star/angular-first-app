<section class="listing" [class.selected]="isChecked">
  @if (housingLocation().isPremium) {
  <div class="premium-tag">
    <img class="premium-icon" src="assets/crown.svg" alt="premium-icon" />
    Premium
  </div>
  }

  <img
    class="listing-photo"
    [src]="housingLocation().photo"
    alt="Exterior photo of {{ housingLocation().name }}"
    [routerLink]="['/home', housingLocation().id]"
    crossorigin
  />
  <h2 class="listing-heading">{{ housingLocation().name }}</h2>
  <p class="listing-location">{{ housingLocation().city }}, {{ housingLocation().state }}</p>
  <input type="checkbox" (change)="onCheckboxSelected($event)" name="cb" />
  <label for="cb">Select</label>
  <button
    class="primary edit-button"
    [routerLink]="['/home/edit', housingLocation().id]"
    [replaceUrl]="true"
  >
    <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M 43.2930 16.9258 L 45.6601 14.6055 C 46.8555 13.4101 46.9023 12.1211 45.8477 11.0430 L 45.0508 10.2461 C 43.9961 9.1914 42.7070 9.3086 41.5117 10.4570 L 39.1445 12.8008 Z M 15.6601 44.4883 L 41.2305 18.9414 L 37.1289 14.8164 L 11.5352 40.3867 L 9.3086 45.5898 C 9.0977 46.1523 9.6836 46.8086 10.2461 46.5742 Z"
      />
    </svg>
  </button>
</section>
